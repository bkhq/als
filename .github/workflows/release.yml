name: Release

# Builds per-platform `als` binaries and uploads them as assets to an
# existing GitHub Release. The release (and its tag) is created from the
# client, e.g.:
#
#   gh release create v0.1.0 --target main --generate-notes
#
# That publishes the release on the remote (tagging main's HEAD, so no
# local tag is required) and fires the `release: published` event below,
# which runs the per-platform builds and attaches the binaries.
#
# Packaging:
#   Unix:    als-<subpkg>.tar.gz   (contains ./als)
#   Windows: als-<subpkg>.zip      (contains als.exe)
#
# Distribution targets match docs/cli-spec.md:
#   - als-linux-x64       x86_64-unknown-linux-musl
#   - als-linux-arm64     aarch64-unknown-linux-musl
#   - als-darwin-x64      x86_64-apple-darwin
#   - als-darwin-arm64    aarch64-apple-darwin
#   - als-windows-x64     x86_64-pc-windows-msvc
#
# Profile: `dist` (opt-level = "z", strip = "symbols", panic = "abort"),
# defined in the workspace Cargo.toml. Output lives under
# target/<triple>/dist/als.

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

# Default to read-only across every job. The `release` job below
# explicitly upgrades to `contents: write` so it can publish the
# GitHub Release; every other job (per-platform builds) stays
# read-only.
permissions:
  contents: read

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check version format
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$TAG' must match vMAJOR.MINOR.PATCH (e.g. v0.1.0)"
            exit 1
          fi

  build-linux:
    name: build linux (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            subpkg: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            subpkg: linux-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build dist
        run: cargo build --profile dist --bin als --target ${{ matrix.target }} --locked

      - name: Package tarball
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/als" "als"
          chmod +x "als"
          tar -czf "dist/als-${{ matrix.subpkg }}.tar.gz" "als"
          rm "als"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.subpkg }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build macos (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-26-intel
            subpkg: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-26
            subpkg: darwin-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build dist
        run: cargo build --profile dist --bin als --target ${{ matrix.target }} --locked

      - name: Package tarball
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/als" "als"
          chmod +x "als"
          tar -czf "dist/als-${{ matrix.subpkg }}.tar.gz" "als"
          rm "als"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.subpkg }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build windows (${{ matrix.target }})
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            subpkg: windows-x64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build dist
        run: cargo build --profile dist --bin als --target ${{ matrix.target }} --locked

      - name: Package zip
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/als.exe" "als.exe"
          7z a "dist/als-${{ matrix.subpkg }}.zip" "als.exe"
          rm "als.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.subpkg }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: upload release assets
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            artifacts/*.tar.gz artifacts/*.zip artifacts/checksums.txt \
            --clobber
