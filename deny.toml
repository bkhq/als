[graph]
all-features = true

[advisories]
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    # File-level copyleft; linked as a library (mdbook) without modifying its
    # sources, so it does not encumber our binary.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl", reason = "use rustls (pma-rust Lock 1)" },
    { name = "openssl-sys", reason = "use rustls (pma-rust Lock 1)" },
    { name = "native-tls", reason = "use rustls (pma-rust Lock 1)" },
    { name = "native-tls-sys", reason = "use rustls (pma-rust Lock 1)" },
    { name = "dotenv", reason = "unmaintained — use dotenvy" },
    { name = "ring", version = "<0.17", reason = "0.16 has known soundness issues" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
