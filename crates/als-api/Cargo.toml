[package]
name = "als-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "als CLI typed HTTP client"

[lib]
name = "als_api"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
als-core = { path = "../als-core" }
reqwest = { workspace = true, features = ["query"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serial_test.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# `blocking` feature is layered on top of the workspace reqwest entry so the
# synchronous client is available only in integration tests.
reqwest = { workspace = true, features = ["blocking"] }
