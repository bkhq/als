[package]
name = "als"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "als — upload and publish static sites from your terminal"

[[bin]]
name = "als"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
als-core = { path = "../als-core" }
als-api = { path = "../als-api" }
als-pack = { path = "../als-pack" }
als-md = { path = "../als-md" }
als-preview = { path = "../als-preview" }
als-code = { path = "../als-code" }
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zip.workspace = true
indicatif.workspace = true
dialoguer.workspace = true
secrecy.workspace = true
url.workspace = true
rand.workspace = true
tempfile.workspace = true
qrcode.workspace = true
hostname.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serial_test.workspace = true
once_cell.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# `blocking` feature is layered on top of the workspace reqwest entry so the
# synchronous client is available only in integration tests.
reqwest = { workspace = true, features = ["blocking"] }
